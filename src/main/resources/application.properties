# ═══════════════════════════════════════════
# H2 Database — managed by DataSourceConfig
# ═══════════════════════════════════════════
# NOTE: DataSource is now configured programmatically by DataSourceConfig.java
# These default values are used ONLY if DataSourceConfig bean fails to load.
spring.datasource.url=jdbc:h2:file:./data/library;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE;FILE_LOCK=NO
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 encryption (set to false for development without OS keystore)
app.h2.encryption.enabled=true
app.h2.path=./data/library

# ═══════════════════════════════════════════
# JPA Configuration
# ═══════════════════════════════════════════
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.javax.persistence.validation.mode=none

# ═══════════════════════════════════════════
# Borrow Configuration
# ═══════════════════════════════════════════
borrow.default.due.days=14

# ═══════════════════════════════════════════
# Internationalization
# ═══════════════════════════════════════════
spring.messages.basename=messages
spring.messages.encoding=UTF-8

# ═══════════════════════════════════════════
# Logging
# ═══════════════════════════════════════════
logging.level.net.gizmolab=INFO
logging.level.org.hibernate.SQL=WARN
